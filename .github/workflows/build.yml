name: Build GastroAnalytics

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean `
            --name GastroAnalytics `
            --onefile `
            --noconsole `
            --paths . `
            --hidden-import brand_service `
            --hidden-import analytics `
            --hidden-import importer `
            --hidden-import database `
            --hidden-import payout_analytics `
            --hidden-import payout_parser `
            --collect-all customtkinter `
            --collect-all matplotlib `
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastroAnalytics-Windows
          path: dist/GastroAnalytics.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build macOS binary
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name GastroAnalytics \
            --onefile \
            --windowed \
            --paths . \
            --hidden-import brand_service \
            --hidden-import analytics \
            --hidden-import importer \
            --hidden-import database \
            --hidden-import payout_analytics \
            --hidden-import payout_parser \
            --collect-all customtkinter \
            --collect-all matplotlib \
            main.py

      - name: Zip macOS binary
        shell: bash
        run: |
          zip -j dist/GastroAnalytics-macOS-ARM.zip dist/GastroAnalytics

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GastroAnalytics-macOS-ARM
          path: dist/GastroAnalytics-macOS-ARM.zip
